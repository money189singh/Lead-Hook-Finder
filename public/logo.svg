<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Main Hook Gradient -->
    <linearGradient id="hookMainGradient" x1="60%" y1="5%" x2="35%" y2="95%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="35%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#004AE8" />
      <stop offset="100%" stop-color="#0038D6" />
    </linearGradient>

    <!-- Ribbon Fold Shadow Gradient (Inner turn) -->
    <linearGradient id="ribbonFoldShadow" x1="15%" y1="100%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#002DB3" />
      <stop offset="50%" stop-color="#003ECB" />
      <stop offset="100%" stop-color="#0055F5" />
    </linearGradient>

    <!-- Ribbon Tip Highlight Gradient (Front light facet) -->
    <linearGradient id="ribbonTipGradient" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="45%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0040E0" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Main Hook with Punched Center Eyelet Hole -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 320 83
        C 354.2 83, 382 110.8, 382 145
        C 382 170.5, 366.5 192.4, 344 203
        L 344 285
        C 344 353.5, 290.5 410, 222 410
        C 168 410, 126 375, 142 320
        C 152 284, 185 240, 212 218
        L 212 272
        C 192 288, 188 318, 198 338
        C 207 356, 226 360, 240 358
        C 268 354, 290 326, 290 285
        L 290 203
        C 267.5 192.4, 258 170.5, 258 145
        C 258 110.8, 285.8 83, 320 83
        Z
        M 320 120
        A 25 25 0 1 0 320 170
        A 25 25 0 1 0 320 120
        Z
      "
      fill="url(#hookMainGradient)"
    />

    <!-- Ribbon Fold Inner Shadow Layer -->
    <path
      d="
        M 142 320
        C 134 350, 155 385, 190 402
        C 170 380, 160 350, 168 322
        C 174 300, 192 275, 212 258
        L 212 218
        C 185 240, 152 284, 142 320
        Z
      "
      fill="url(#ribbonFoldShadow)"
    />

    <!-- Ribbon Tip Front Highlight Facet -->
    <path
      d="
        M 130 315
        C 130 315, 138 270, 172 232
        C 188 214, 212 218, 212 218
        L 212 272
        C 192 288, 178 308, 168 335
        C 158 358, 142 355, 134 340
        C 130 332, 130 322, 130 315
        Z
      "
      fill="url(#ribbonTipGradient)"
    />
  </g>
</svg>
