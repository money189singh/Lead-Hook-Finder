name: leadhook-prospecting-system
region: nyc
services:
  # Web API & Frontend Service
  - name: leadhook-web
    github:
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm run start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 3000
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
    envs:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        type: SECRET
      - key: GOOGLE_MAPS_API_KEY
        type: SECRET
      - key: SEARCH_API_KEY
        type: SECRET

workers:
  # DigitalOcean Background Execution Worker
  # Runs prospect discovery, searches, crawling, AI enrichment independently
  - name: leadhook-discovery-worker
    github:
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm run start:worker
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-s
    envs:
      - key: NODE_ENV
        value: production
      - key: DIGITALOCEAN_WORKER_ID
        value: do-worker-ams3-01
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: WORKER_POLL_INTERVAL_MS
        value: "2500"
      - key: HEARTBEAT_INTERVAL_MS
        value: "5000"
      - key: GEMINI_API_KEY
        type: SECRET
      - key: GOOGLE_MAPS_API_KEY
        type: SECRET
      - key: SEARCH_API_KEY
        type: SECRET
